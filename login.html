<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="bg-light">
        <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
            <div class="container">
                <a href="index.html" class="navbar-brand d-flex align-items-center">
                    <span class="fw-bold">Online Quiz System</span>
                </a>
                <div class="d-flex align-items-center gap-3 ms-auto">
                    <a href="index.html#about" class="nav-link text-dark">About</a>
                    <a href="login.html" class="nav-link text-dark">Login</a>
                    <a href="register.html" class="nav-link text-dark">Register</a>
                </div>
            </div>
        </nav>

        <main class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card shadow-lg border-0 rounded-4">
                        <div class="card-body p-4 p-md-5">
                            <div class="text-center mb-4">
                                <h2 class="fw-bold mb-1">Welcome Back</h2>
                                <p class="text-muted mb-0">Login to continue your quiz journey</p>
                            </div>

                            <form>
                                <div class="mb-3">
                                    <label for="email" class="form-label fw-semibold">Email address</label>
                                    <input type="email" class="form-control form-control-lg" id="email" placeholder="Enter your email" required>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label fw-semibold">Password</label>
                                    <input type="password" class="form-control form-control-lg" id="password" placeholder="Enter your password" required>
                                </div>

                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="rememberMe">
                                        <label class="form-check-label" for="rememberMe">Remember me</label>
                                    </div>
                                    <a href="#" class="text-decoration-none">Forgot password?</a>
                                </div>

                                <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                                    <b>Login</b>
                                </button>

                                <p class="text-center mb-0 text-muted">
                                    Don't have an account?
                                    <a href="register.html" class="text-decoration-none fw-semibold">Register here</a>
                                </p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="bg-dark text-white text-center py-4 mt-5">
            <p class="mb-1">© 2026 Online Quiz System. All rights reserved.</p>
            <p class="mb-1">Developed by: <b>Syed Danish Ahmed</b>, <b>Syed Ashar Ali</b>, <b>Saurabh Kadam</b></p>
            <p class="mb-0">Contact: <a href="mailto:onlinequizcontact@gmail.com" class="text-white text-decoration-underline">
                <b>onlinequizcontact@gmail.com</b></a></p>
        </footer>
    </body>
</html>
